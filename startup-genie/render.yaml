services:
  # Backend MCP Server
  - type: web
    name: startup-genie-backend
    env: node
    plan: free
    rootDir: startup-genie/mcp-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    healthCheckPath: /api/health

  # Frontend React App
  - type: web
    name: startup-genie-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://startup-genie-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
